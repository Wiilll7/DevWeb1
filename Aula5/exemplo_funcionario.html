<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function processarFormulario() {
            
            var nome = document.getElementById("nome").value;
            var dataNascimento = document.getElementById("dataNascimento").value;
            var sexo = document.getElementById("sexo").value;
            var cpf = document.getElementById("cpf").value;
            var rg = document.getElementById("rg").value;
            var tituloEleitoral = document.getElementById("tituloEleitoral").value;

            var telefone = document.getElementById("telefone").value;

            var rua = document.getElementById("rua").value;
            var numero = document.getElementById("numero").value;
            var bairro = document.getElementById("bairro").value;
            var cidade = document.getElementById("cidade").value;
            var estado = document.getElementById("estado").value;
            var cep = document.getElementById("cep").value;

            var saida = document.getElementById("saida");

            saida.innerHTML =
                "<ul>" +
                    "<li>Nome: " + nome + "</li>" +
                    "<li>Data de Nascimento: " + dataNascimento + "</li>" +
                    "<li>Sexo: " + sexo + "</li>" +
                    "<li>CPF: " + cpf + "</li>" +
                    "<li>RG: " + rg + "</li>" +
                    "<li>Título Eleitoral: " + tituloEleitoral + "</li>" +
                    "<li>Telefone: " + telefone + "</li>" +
                    "<li>Endereço: " + rua + ", " + numero + " - " + bairro + "</li>" +
                    "<li>Cidade: " + cidade + " - " + estado + "</li>" +
                    "<li>CEP: " + cep + "</li>" +
                "</ul>";

            console.log("saida");
        }
    </script>
</head>
<body>
    <form onsubmit="processarFormulario(); return false;">

        <label for="nome">Nome:</label>
        <input type="text" id="nome"><br><br>

        <label for="sexo">Sexo:</label>
        <select id="sexo">
            <option value="">Selecione</option>
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
        </select><br><br>

        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="text" id="dataNascimento"><br><br>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf"><br><br>

        <label for="rg">RG:</label>
        <input type="text" id="rg"><br><br>

        <label for="tituloEleitoral">Título Eleitoral:</label>
        <input type="text" id="tituloEleitoral"><br><br>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone"><br><br>

         <h3>Endereço</h3>

        <label for="rua">Rua:</label>
        <input type="text" id="rua"><br><br>

        <label for="numero">Número:</label>
        <input type="text" id="numero"><br><br>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro"><br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade"><br><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado"><br><br>

        <label for="cep">CEP:</label>
        <input type="text" id="cep"><br><br>

        <button type="button" onclick="processarFormulario()">Enviar</button>
    </form>
    <div id="saida"></div>
</body>
</html>
