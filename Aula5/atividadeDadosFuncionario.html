<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Completo de Funcionários</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-section { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 12px; }
        th { background-color: #f4f4f4; }
        
        .maior-salario { background-color: #ffcccc !important; }
        .menor-salario { background-color: #ffffcc !important; }
    </style>
</head>
<body>

    <h2>Formulário Funcionário</h2>
    <form id="funcionarioForm">
        <label>Nome: <input type="text" id="nome"></label><br><br>
        <label>Sexo: 
            <select id="sexo">
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
            </select>
        </label><br><br>
        <label>Data de Nascimento: <input type="text" id="dataNascimento"></label><br><br>
        <label>CPF: <input type="text" id="cpf"></label><br><br>
        <label>RG: <input type="text" id="rg"></label><br><br>
        <label>Título Eleitoral: <input type="text" id="tituloEleitoral"></label><br><br>
        <label>Telefone: <input type="text" id="telefone"></label><br><br>

        <h3>Endereço</h3>
        <label>Rua: <input type="text" id="rua"></label> 
        <label>Nº: <input type="text" id="numero"></label><br><br>
        <label>Bairro: <input type="text" id="bairro"></label> 
        <label>Cidade: <input type="text" id="cidade"></label><br><br>
        <label>Estado: <input type="text" id="estado"></label> 
        <label>CEP: <input type="text" id="cep"></label><br><br>

        <hr>
        <h3>Tabela</h3>
        <label>Salário Base: <input type="number" id="salarioBase" step="0.01"></label><br><br>
        <label>Nº de Filhos: <input type="number" id="nroFilhos" min="0"></label><br><br>

        <button type="button" onclick="processarFormulario()">Cadastrar e Gerar Tabela</button>
    </form>

    <div id="resultado">
        <table id="tabelaDados">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Cidade/UF</th>
                    <th>Salário Base</th>
                    <th>V.A.</th>
                    <th>Sal. Família</th>
                    <th>INSS (20%)</th>
                    <th>Desc. Totais</th>
                    <th>Salário Total</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                </tbody>
        </table>
    </div>

    <script>
        var listaFuncionarios = [];

        function processarFormulario() {
            var obj = {
                nome: document.getElementById("nome").value,
                sexo: document.getElementById("sexo").value,
                cpf: document.getElementById("cpf").value,
                cidade: document.getElementById("cidade").value,
                estado: document.getElementById("estado").value,
                // Novos campos necessários para os cálculos
                salarioBase: parseFloat(document.getElementById("salarioBase").value) || 0,
                nroFilhos: parseInt(document.getElementById("nroFilhos").value) || 0
            };

            obj.valeAlimentacao = 450.00;
            obj.inss = obj.salarioBase * 0.20;
            
            var filhosParaCalculo = obj.nroFilhos > 3 ? 3 : obj.nroFilhos;
            obj.salarioFamilia = 100 * filhosParaCalculo;
            
            obj.descontosTotais = obj.inss;
            obj.salarioTotal = (obj.salarioBase + obj.valeAlimentacao + obj.salarioFamilia) - obj.descontosTotais;

            listaFuncionarios.push(obj);

            desenharTabela();
            
            document.getElementById("funcionarioForm").reset();
        }

        function desenharTabela() {
            var corpo = document.getElementById("corpoTabela");
            corpo.innerHTML = "";

            var salarios = listaFuncionarios.map(function(f) { return f.salarioTotal; });
            var maior = Math.max.apply(null, salarios);
            var menor = Math.min.apply(null, salarios);

            for (var i = 0; i < listaFuncionarios.length; i++) {
                var f = listaFuncionarios[i];
                var classeCor = "";

                if (listaFuncionarios.length > 1) {
                    if (f.salarioTotal === maior) classeCor = "maior-salario";
                    else if (f.salarioTotal === menor) classeCor = "menor-salario";
                }

                var linha = "<tr class='" + classeCor + "'>" +
                    "<td>" + f.nome + "</td>" +
                    "<td>" + f.cpf + "</td>" +
                    "<td>" + f.cidade + "/" + f.estado + "</td>" +
                    "<td>R$ " + f.salarioBase.toFixed(2) + "</td>" +
                    "<td>R$ " + f.valeAlimentacao.toFixed(2) + "</td>" +
                    "<td>R$ " + f.salarioFamilia.toFixed(2) + "</td>" +
                    "<td>R$ " + f.inss.toFixed(2) + "</td>" +
                    "<td>R$ " + f.descontosTotais.toFixed(2) + "</td>" +
                    "<td><strong>R$ " + f.salarioTotal.toFixed(2) + "</strong></td>" +
                "</tr>";
                
                corpo.innerHTML += linha;
            }
        }
    </script>
</body>
</html>
